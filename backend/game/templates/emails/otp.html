<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Код входа</title>
</head>
<body style="margin:0;padding:0;background:#101113;font-family:system-ui,-apple-system,sans-serif;color:#e7f2eb;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#101113;padding:32px 16px;">
    <tr>
      <td align="center">
        <table width="100%" style="max-width:420px;background:#152028;border:1px solid rgba(238,27,46,0.45);border-radius:8px;">
          <tr>
            <td style="padding:28px 24px;text-align:center;">
              <div style="font-size:11px;letter-spacing:0.12em;color:#ee1b2e;font-weight:700;">FM</div>
              <h1 style="margin:12px 0 8px;font-size:20px;font-weight:700;color:#fff;">Код для входа</h1>
              <p style="margin:0 0 24px;font-size:14px;line-height:1.5;color:#9eb0a8;">
                Введите этот код в приложении. Действует {{ minutes }} мин.
              </p>
              <div style="font-size:32px;font-weight:800;letter-spacing:0.35em;color:#3dd68c;padding:16px;background:rgba(0,0,0,0.35);border-radius:6px;">
                {{ code }}
              </div>
              <p style="margin:24px 0 0;font-size:12px;line-height:1.5;color:#6d8a7a;">
                Код одноразовый. Никому его не сообщайте. Если вы не запрашивали вход — проигнорируйте письмо.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
